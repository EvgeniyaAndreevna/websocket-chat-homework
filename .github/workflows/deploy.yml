name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build Webpack frontend
        run: npm run build
        env:
          WS_URL: ${{ vars.WS_URL }}
      # Pages must be enabled manually: Settings > Pages > Source > GitHub Actions.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Explain Pages configuration failure
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::Check repository Settings > Pages > Build and deployment > Source: GitHub Actions. Pages must be enabled before deployment."
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
